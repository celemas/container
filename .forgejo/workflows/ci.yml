name: ci

on:
  push:
  workflow_dispatch:
  # Weekly full mutation run; pushes only mutate the changed lines.
  schedule:
    - cron: '0 4 * * 1'

jobs:
  ci:
    runs-on: ci-base
    steps:
      - name: Checkout repo
        uses: https://code.forgejo.org/actions/checkout@v5
        with:
          # Full history so mutation tests can diff against the pushed range.
          fetch-depth: 0

      - name: Install packages with composer
        run: composer install --prefer-dist --no-interaction
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ secrets.GH_TOKEN }}"}}'

      - name: Run PHP lint checks
        run: composer lint

      - name: Run documentation tests
        run: composer docstest

      - name: Run Markdown lint checks
        run: composer docs:lint

      - name: Run tests with coverage
        run: composer coverage:test
        env:
          XDEBUG_MODE: coverage

      - name: Analyze coverage
        run: composer coverage:analyze

      - name: Run mutation tests
        env:
          EVENT: ${{ forgejo.event_name }}
          BEFORE: ${{ forgejo.event.before }}
        run: |
          # Infection collects its own line coverage instead of reusing the
          # coverage step's: its JUnit test times are inflated by coverage
          # collection and would make Infection skip mutants as too slow.
          set --
          # Pushes mutate only changed lines. New branches and force pushes
          # have no usable base commit and run the full suite, as do
          # scheduled and manual runs.
          if [ "$EVENT" = push ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            set -- "$@" --git-diff-lines --git-diff-base="$BEFORE"
          fi
          composer mutation -- "$@"

      - name: Deploy code coverage report
        if: ${{ always() && forgejo.ref == 'refs/heads/main' }}
        run: deploy-code-coverage .coverage

      - name: Run static analysis
        if: ${{ always() }}
        run: |
          set -o pipefail
          composer types -- --stats --report=psalm-issues.json 2>&1 | tee psalm-stats.txt

      - name: Deploy type coverage report
        if: ${{ always() && forgejo.ref == 'refs/heads/main' }}
        run: deploy-type-coverage
